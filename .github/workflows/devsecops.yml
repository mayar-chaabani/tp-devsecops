name: DevSecOps pipeline

on:
  pull_request:
  push:
    branches: [devsecops]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: Build & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Compile (syntax check)
        run: python -m compileall -q app

      - name: Unit tests
        run: pytest -q

      - name: Build Docker image
        run: docker build -t cinema-api:ci .

  sast:
    name: SAST (Bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Bandit image (TP1)
        run: docker build -t bandit:1.9.4 security/bandit

      - name: Full report (all severities)
        run: |
          mkdir -p reports
          docker run --rm -v "$PWD:/src" bandit:1.9.4 -r . -x ./tests,./alembic \
            -f html -o reports/bandit.html --exit-zero

      # Security gate: Bandit exits 1 if it finds any HIGH severity issue.
      - name: Gate - block on HIGH severity
        run: docker run --rm -v "$PWD:/src" bandit:1.9.4 -r . -x ./tests,./alembic --severity-level high

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-report
          path: reports/bandit.html

  sca:
    name: SCA (Snyk)
    runs-on: ubuntu-latest
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Check Snyk token
        run: |
          if [ -z "$SNYK_TOKEN" ]; then
            echo "::error::Missing SNYK_TOKEN secret (Settings > Secrets and variables > Actions)"
            exit 1
          fi

      - name: Install Snyk CLI
        run: npm install -g snyk@1.1308.0

      - name: Build application image
        run: docker build -t cinema-api:ci .

      - name: Full report (all severities)
        run: |
          mkdir -p reports
          snyk container test cinema-api:ci --file=Dockerfile --exclude-base-image-vulns \
            --json-file-output=reports/snyk.json || true

      # Security gate: Snyk exits 1 if it finds a HIGH or CRITICAL vulnerability.
      - name: Gate - block on HIGH/CRITICAL
        run: |
          snyk container test cinema-api:ci --file=Dockerfile --exclude-base-image-vulns \
            --severity-threshold=high

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snyk-report
          path: reports/snyk.json

  dast:
    name: DAST (OWASP ZAP)
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4

      # Ephemeral environment: lives only inside this job's runner, destroyed at the end.
      - name: Deploy ephemeral environment
        run: docker compose up -d --build

      - name: Wait for the API
        run: timeout 120 sh -c 'until curl -sf http://localhost:8000/openapi.json > /dev/null; do sleep 2; done'

      - name: ZAP API scan
        run: |
          mkdir -p reports && chmod a+w reports
          # Our copy of ZAP's API-Minimal policy + rule 40012 (Reflected XSS), which the stock policy leaves out.
          docker run --rm --network host -v "$PWD/reports:/zap/wrk:rw" \
            -v "$PWD/security/zap/API-Minimal.policy:/home/zap/.ZAP/policies/API-Minimal.policy:ro" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-api-scan.py -t http://localhost:8000/openapi.json -f openapi \
            -r zap.html -J zap.json -I

      # Security gate: HIGH is ZAP's top risk level (ZAP has no "critical").
      - name: Gate - block on HIGH risk alerts
        run: |
          jq -r '.site[].alerts[] | "\(.riskdesc)\t\(.name)"' reports/zap.json | sort -u
          high=$(jq '[.site[].alerts[] | select(.riskcode == "3")] | length' reports/zap.json)
          if [ "$high" -gt 0 ]; then
            echo "::error::OWASP ZAP found $high HIGH risk alert(s)"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-report
          path: reports/zap.*

      - name: API logs (on failure)
        if: failure()
        run: docker compose logs api

      - name: Destroy ephemeral environment
        if: always()
        run: docker compose down -v
