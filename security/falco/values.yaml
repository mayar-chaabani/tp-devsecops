# Falco on the Docker Desktop cluster (chart falcosecurity/falco 9.2.2)
driver:
  kind: modern_ebpf # eBPF probe built into Falco: no kernel module to compile
tty: true # print alerts to the logs immediately

# Rule specific to our app: only the API process may read the secrets mounted in part 2.
customRules:
  cinema-rules.yaml: |-
    - rule: App secret read by unexpected process
      desc: A process other than the API reads the Kubernetes secrets mounted in /run/secrets/app
      condition: >
        open_read and container and k8s.ns.name = "cinema"
        and fd.name startswith /run/secrets/app/ and proc.name != python
      output: >
        App secret read by unexpected process | file=%fd.name command=%proc.cmdline
        user_uid=%user.uid container=%container.name pod=%k8s.pod.name ns=%k8s.ns.name
      priority: WARNING
      tags: [cinema, secrets, T1552]
