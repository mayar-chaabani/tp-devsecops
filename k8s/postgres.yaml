apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: cinema
spec:
  selector: { app: db }
  ports: [{ port: 5432 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: cinema
spec:
  replicas: 1
  selector: { matchLabels: { app: db } }
  template:
    metadata: { labels: { app: db } }
    spec:
      automountServiceAccountToken: false
      securityContext: { fsGroup: 70 } # group of the postgres user: can read the secret file
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - { name: POSTGRES_DB, value: fastapi_db }
            # The image reads the password from a file: it never appears in the environment.
            - { name: POSTGRES_PASSWORD_FILE, value: /run/secrets/db/POSTGRES_PASSWORD }
          volumeMounts:
            - { name: db-credentials, mountPath: /run/secrets/db, readOnly: true }
            - { name: data, mountPath: /var/lib/postgresql/data }
          readinessProbe:
            exec: { command: ["pg_isready", "-h", "127.0.0.1", "-U", "postgres"] }
            periodSeconds: 2
      volumes:
        - name: db-credentials
          secret: { secretName: db-credentials, defaultMode: 0440 }
        # shortcut: data is lost when the pod restarts, use a PersistentVolumeClaim outside a demo
        - name: data
          emptyDir: {}
