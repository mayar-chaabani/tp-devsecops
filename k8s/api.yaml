apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: cinema
spec:
  selector: { app: api }
  ports: [{ port: 8000 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: cinema
spec:
  replicas: 1
  selector: { matchLabels: { app: api } }
  template:
    metadata: { labels: { app: api } }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: api
          image: cinema-api:k8s
          imagePullPolicy: Never # local image built with docker build
          env:
            - { name: DEBUG, value: "false" }
          # DATABASE_URL and SECRET_KEY are read by the app from these files (pydantic secrets_dir).
          volumeMounts:
            - { name: api-secrets, mountPath: /run/secrets/app, readOnly: true }
            - { name: uploads, mountPath: /app/uploads }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          readinessProbe:
            httpGet: { path: /openapi.json, port: 8000 }
            periodSeconds: 5
      volumes:
        - name: api-secrets
          secret: { secretName: api-secrets, defaultMode: 0440 }
        - name: uploads
          emptyDir: {}
